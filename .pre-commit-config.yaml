repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: check-added-large-files
    -   id: check-merge-conflict
-   repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        stages: [pre-commit]
        language: system
        types: [python]
        args: ["--profile", "black"]
        exclude: ^(\.venv/|\.idea/|\.pytest_cache/)
-   repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
    -   id: black
        language_version: python3.12
        stages: [pre-commit]
        language: python
        types: [python]
        exclude: ^(\.venv/|\.idea/|\.pytest_cache/)
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.278
    hooks:
        - id: ruff
          stages: [pre-commit]
          language: system
          entry: ruff check release_tools tests
          pass_filenames: false
          args: [--fix, --exit-non-zero-on-fix]
