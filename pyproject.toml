[project]
name = "fo-release-branch-creator"
version = "0.1.7"
description = "Create GitLab release branches from EVA release tasks."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "certifi>=2025.11.12",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25",
    "isort>=5.13.2,<6",
    "pre-commit>=3.8.0,<4",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.9.2,<0.10",
]

[project.scripts]
create-release-branches = "release_tools.commands.create_release_branches:main"
create-merge-request-links = "release_tools.commands.create_merge_request_links:main"
create-release-merge-request-links = "release_tools.commands.create_release_merge_request_links:main"
create-endpoint-report = "release_tools.commands.create_endpoint_report:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "release_tools"
module-root = ""

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
use_parentheses = true
ensure_newline_before_comments = true
wrap_length = 80
line_length = 120

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py312"
respect-gitignore = true
exclude = [
    ".git",
    ".git-rewrite",
    ".nox",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "build",
    ".idea",
    ".pytest_cache",
    ".vscode",
    "dist",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLC1901",
    "W291",
]
fixable = ["ALL"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
